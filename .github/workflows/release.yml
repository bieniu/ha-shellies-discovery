name: Release

on:
  release:
    types: [published]

jobs:
  release_zip_file:
    name: Prepare release asset
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set package version
        run: |
          version="${{ github.event.release.tag_name }}"
          cd "${{ github.workspace }}/python_scripts"
          sed -i "s/^VERSION = \".*\"/VERSION = \"${version}\"/" shellies_discovery.py

      - name: ZIP files
        run: |
          cd "${{ github.workspace }}/python_scripts"
          zip shellies-discovery.zip -r ./

      - name: Upload zip to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de  # 2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "${{ github.workspace }}/python_scripts/shellies-discovery.zip"
          asset_name: shellies-discovery.zip
          tag: ${{ github.ref }}
          overwrite: true
